# ============================================================================
# Sinergia Digital - fragmento de nginx
# Copia estos bloques dentro de tu server {} (VPS propio, Dokploy, Coolify, etc.)
# Reemplaza www.sinergia.digital por tu dominio real.
# ============================================================================

# ---------- 1. Redireccion HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name sinergia.digital www.sinergia.digital;
    return 301 https://www.sinergia.digital$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sinergia.digital www.sinergia.digital;

    # ---------- 2. TLS ----------
    ssl_certificate     /etc/letsencrypt/live/www.sinergia.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sinergia.digital/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/sinergia;
    index index.html;

    # ---------- 3. Cabeceras de seguridad ----------
    # HSTS: sube "preload" y "includeSubDomains" solo cuando estes seguro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Frame-Options y frame-ancestors deben ir como cabecera (en <meta> se ignoran).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP como cabecera. 'unsafe-inline' porque CSS y JS van embebidos.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.bc.gob.cu; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com https://images.pexels.com; connect-src 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

    # ---------- 4. Compresion ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---------- 5. Cache ----------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=86400"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=86400"; }

    # ---------- 6. Rutas limpias (History API) ----------
    # Cualquier ruta desconocida se sirve con index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 7. Bloquea archivos sensibles ----------
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(md|log|bak|sql|ini|conf)$ { deny all; }
}
